<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1E3A"/>
      <stop offset="100%" stop-color="#0E0E1E"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A50"/>
      <stop offset="100%" stop-color="#1A1A35"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D442"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>

  <!-- Outer gold border accent -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.5"/>

  <!-- N64-style cartridge body -->
  <g transform="translate(128, 108)">
    <!-- Main cartridge shell -->
    <rect x="-72" y="-68" width="144" height="132" rx="8" fill="url(#cartGrad)" stroke="#E2B714" stroke-width="2.5"/>

    <!-- Top grip ridges -->
    <rect x="-72" y="-68" width="144" height="14" rx="8" fill="#222248"/>
    <rect x="-72" y="-68" width="144" height="14" rx="8" fill="none" stroke="#E2B714" stroke-width="2.5"/>
    <line x1="-40" y1="-68" x2="-40" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>
    <line x1="-25" y1="-68" x2="-25" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>
    <line x1="-10" y1="-68" x2="-10" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>
    <line x1="5" y1="-68" x2="5" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="-68" x2="20" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>
    <line x1="35" y1="-68" x2="35" y2="-54" stroke="#E2B714" stroke-width="1.5" opacity="0.3"/>

    <!-- Label area -->
    <rect x="-58" y="-48" width="116" height="68" rx="5" fill="url(#labelGrad)" stroke="#00D4AA" stroke-width="1.5"/>

    <!-- "64" large bold text on label -->
    <text x="0" y="-4" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#E2B714" letter-spacing="-2">64</text>

    <!-- Bottom connector pins -->
    <rect x="-48" y="52" width="96" height="12" rx="3" fill="#0D0D1E" stroke="#E2B714" stroke-width="1.5" opacity="0.6"/>
    <!-- Pin details -->
    <line x1="-35" y1="54" x2="-35" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
    <line x1="-22" y1="54" x2="-22" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
    <line x1="-9" y1="54" x2="-9" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
    <line x1="4" y1="54" x2="4" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
    <line x1="17" y1="54" x2="17" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="54" x2="30" y2="62" stroke="#E2B714" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- "STASH" text at bottom -->
  <text x="128" y="232" text-anchor="middle" font-family="monospace, 'Courier New'" font-weight="bold" font-size="24" fill="#00D4AA" letter-spacing="8" opacity="0.9">STASH</text>

  <!-- Subtle corner glow -->
  <circle cx="48" cy="48" r="30" fill="#E2B714" opacity="0.04"/>
  <circle cx="208" cy="48" r="30" fill="#00D4AA" opacity="0.04"/>
</svg>
