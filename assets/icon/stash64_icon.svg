<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#1A1A2E"/>

  <!-- Inner frame -->
  <rect x="16" y="16" width="224" height="224" rx="28" fill="#16213E" stroke="#E2B714" stroke-width="3"/>

  <!-- Stacked cartridges -->

  <!-- Back cartridge (Genesis/Mega Drive style - tall, rounded top) -->
  <g transform="translate(128, 128)">
    <rect x="-55" y="-75" width="110" height="130" rx="6" fill="#2A1A3E" stroke="#9B59B6" stroke-width="2"/>
    <rect x="-45" y="-65" width="90" height="50" rx="3" fill="#1A1A2E" stroke="#9B59B6" stroke-width="1.5" opacity="0.8"/>
    <!-- Label lines -->
    <line x1="-35" y1="-50" x2="35" y2="-50" stroke="#9B59B6" stroke-width="1.5" opacity="0.5"/>
    <line x1="-35" y1="-40" x2="20" y2="-40" stroke="#9B59B6" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Middle cartridge (SNES style - wider, notch at bottom) -->
  <g transform="translate(118, 138)">
    <rect x="-50" y="-55" width="100" height="105" rx="5" fill="#1F3A5F" stroke="#6A8CFF" stroke-width="2"/>
    <rect x="-40" y="-45" width="80" height="42" rx="3" fill="#16213E" stroke="#6A8CFF" stroke-width="1.5" opacity="0.8"/>
    <!-- Label lines -->
    <line x1="-30" y1="-32" x2="30" y2="-32" stroke="#6A8CFF" stroke-width="1.5" opacity="0.5"/>
    <line x1="-30" y1="-22" x2="15" y2="-22" stroke="#6A8CFF" stroke-width="1.5" opacity="0.3"/>
    <!-- Bottom edge pins -->
    <rect x="-20" y="40" width="40" height="8" rx="2" fill="#0F1A2E" stroke="#6A8CFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Front cartridge (N64/NES style - compact) -->
  <g transform="translate(138, 145)">
    <rect x="-45" y="-45" width="90" height="90" rx="5" fill="#2E4A1F" stroke="#00D4AA" stroke-width="2"/>
    <rect x="-35" y="-35" width="70" height="38" rx="3" fill="#1A2E16" stroke="#00D4AA" stroke-width="1.5" opacity="0.8"/>
    <!-- Label lines -->
    <line x1="-25" y1="-22" x2="25" y2="-22" stroke="#00D4AA" stroke-width="1.5" opacity="0.5"/>
    <line x1="-25" y1="-12" x2="10" y2="-12" stroke="#00D4AA" stroke-width="1.5" opacity="0.3"/>
    <!-- Grip ridges at top -->
    <line x1="-15" y1="-41" x2="-15" y2="-45" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="-8" y1="-41" x2="-8" y2="-45" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="-1" y1="-41" x2="-1" y2="-45" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="6" y1="-41" x2="6" y2="-45" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
    <line x1="13" y1="-41" x2="13" y2="-45" stroke="#00D4AA" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- "STASH" text -->
  <text x="128" y="222" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="28" fill="#E2B714" letter-spacing="6">STASH</text>

  <!-- Subtle scanline effect -->
  <g opacity="0.03">
    <line x1="16" y1="40" x2="240" y2="40" stroke="white" stroke-width="1"/>
    <line x1="16" y1="60" x2="240" y2="60" stroke="white" stroke-width="1"/>
    <line x1="16" y1="80" x2="240" y2="80" stroke="white" stroke-width="1"/>
    <line x1="16" y1="100" x2="240" y2="100" stroke="white" stroke-width="1"/>
    <line x1="16" y1="120" x2="240" y2="120" stroke="white" stroke-width="1"/>
    <line x1="16" y1="140" x2="240" y2="140" stroke="white" stroke-width="1"/>
    <line x1="16" y1="160" x2="240" y2="160" stroke="white" stroke-width="1"/>
    <line x1="16" y1="180" x2="240" y2="180" stroke="white" stroke-width="1"/>
    <line x1="16" y1="200" x2="240" y2="200" stroke="white" stroke-width="1"/>
    <line x1="16" y1="220" x2="240" y2="220" stroke="white" stroke-width="1"/>
  </g>
</svg>
