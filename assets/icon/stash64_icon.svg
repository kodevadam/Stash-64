<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#1A1A2E"/>

  <!-- Inner frame -->
  <rect x="16" y="16" width="224" height="224" rx="28" fill="#16213E" stroke="#E2B714" stroke-width="3"/>

  <!-- Controller body -->
  <g transform="translate(128, 110)">
    <!-- Main controller shape -->
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="#1F2B47" stroke="#E2B714" stroke-width="2.5"/>

    <!-- Left grip -->
    <path d="M-50,10 Q-70,30 -65,55 Q-60,70 -45,70 Q-30,70 -30,55 L-30,15" fill="#1F2B47" stroke="#E2B714" stroke-width="2.5"/>

    <!-- Right grip -->
    <path d="M50,10 Q70,30 65,55 Q60,70 45,70 Q30,70 30,55 L30,15" fill="#1F2B47" stroke="#E2B714" stroke-width="2.5"/>

    <!-- D-pad -->
    <rect x="-35" y="-8" width="20" height="6" rx="1.5" fill="#E2B714" opacity="0.8"/>
    <rect x="-32" y="-15" width="6" height="20" rx="1.5" fill="#E2B714" opacity="0.8"/>

    <!-- Action buttons -->
    <circle cx="25" cy="-8" r="5" fill="#00D4AA" opacity="0.9"/>
    <circle cx="35" cy="-2" r="5" fill="#E2B714" opacity="0.9"/>
    <circle cx="25" cy="4" r="5" fill="#FF6B6B" opacity="0.7"/>
    <circle cx="15" cy="-2" r="5" fill="#6A8CFF" opacity="0.7"/>

    <!-- Center button / joystick -->
    <circle cx="0" cy="15" r="8" fill="#1A1A2E" stroke="#E2B714" stroke-width="2"/>
    <circle cx="0" cy="15" r="3" fill="#E2B714" opacity="0.6"/>
  </g>

  <!-- "64" text -->
  <text x="128" y="200" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="48" fill="#E2B714" letter-spacing="4">64</text>

  <!-- Subtle scanline effect -->
  <g opacity="0.03">
    <line x1="16" y1="40" x2="240" y2="40" stroke="white" stroke-width="1"/>
    <line x1="16" y1="60" x2="240" y2="60" stroke="white" stroke-width="1"/>
    <line x1="16" y1="80" x2="240" y2="80" stroke="white" stroke-width="1"/>
    <line x1="16" y1="100" x2="240" y2="100" stroke="white" stroke-width="1"/>
    <line x1="16" y1="120" x2="240" y2="120" stroke="white" stroke-width="1"/>
    <line x1="16" y1="140" x2="240" y2="140" stroke="white" stroke-width="1"/>
    <line x1="16" y1="160" x2="240" y2="160" stroke="white" stroke-width="1"/>
    <line x1="16" y1="180" x2="240" y2="180" stroke="white" stroke-width="1"/>
    <line x1="16" y1="200" x2="240" y2="200" stroke="white" stroke-width="1"/>
    <line x1="16" y1="220" x2="240" y2="220" stroke="white" stroke-width="1"/>
  </g>
</svg>
