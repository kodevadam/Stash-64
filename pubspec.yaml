name: stash_64
description: A retro game collection browser for managing and browsing your physical game library across consoles, genres, and storage locations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  file_picker: ^8.0.0
  http: ^1.1.0
  share_plus: ^7.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/covers/
    - assets/icon/
